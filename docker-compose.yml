services:
  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    container_name: torrserver
    ports:
      - "8090:8090"
    environment:
      - TZ=UTC
    restart: unless-stopped

  tfast-addon:
    build: .
    container_name: tfast-addon
    depends_on:
      - torrserver
    ports:
      - "8080:8080"
    environment:
      - PROVIDER_BASE=https://tfast.giize.com/7ac22922
      - PORT=8080
    restart: unless-stopped
